<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAI STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans pb-20">

    <!-- Хедер -->
    <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b z-40 p-4 text-center">
        <h1 class="text-2xl font-black tracking-widest uppercase">MIRAI STUDIO</h1>
    </header>

    <!-- Сетка товаров -->
    <main class="max-w-4xl mx-auto p-4">
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <p class="col-span-full text-center text-stone-400 py-10">Загрузка каталога...</p>
        </div>
    </main>

    <!-- Всплывающее окно карточки товара (Модалка) -->
    <div id="productModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 relative animate-in fade-in slide-in-from-bottom duration-200">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-stone-100 p-2 rounded-full text-stone-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Изображение -->
            <div class="aspect-[3/4] bg-stone-100 rounded-xl overflow-hidden mb-4">
                <img id="modalImg" src="" class="w-full h-full object-cover">
            </div>

            <h2 id="modalTitle" class="text-xl font-bold uppercase mb-1"></h2>
            <p id="modalPrice" class="text-lg font-semibold text-amber-900 mb-3"></p>
            <p id="modalFabric" class="text-xs text-stone-500 mb-2"></p>
            <p id="modalDesc" class="text-sm text-stone-600 mb-4"></p>

            <!-- Переключатель цветов -->
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase text-stone-400 mb-2">Цвет: <span id="selectedColorName" class="text-stone-800"></span></label>
                <div id="modalColors" class="flex gap-3"></div>
            </div>

            <!-- Размеры -->
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase text-stone-400 mb-2">Выберите размер:</label>
                <div id="modalSizes" class="flex gap-2"></div>
            </div>

            <button onclick="orderViaTelegram()" class="w-full py-4 bg-stone-900 text-white font-bold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition">
                <span>Заказать в Telegram</span>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vtkjphnmkghyztysttyd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-HXb9jeMmCmE8IJyOnZRSQ_hclHTZB2";
        
        let allProducts = [];
        let currentProduct = null;
        let selectedVariantIndex = 0;
        let selectedSize = "M";

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                if (window.supabase) {
                    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data, error } = await client.from('products').select('*').order('created_at', { ascending: false });
                    if (!error && data) allProducts = data;
                }
            } catch (e) {
                console.error(e);
            }

            if (allProducts.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-stone-400 py-10">Товаров пока нет.</p>';
                return;
            }

            grid.innerHTML = allProducts.map((p, idx) => {
                const img = (p.variants && p.variants[0] && p.variants[0].images) ? p.variants[0].images[0] : '';
                return `
                    <div onclick="openModal(${idx})" class="bg-white rounded-xl overflow-hidden shadow-sm border border-stone-100 cursor-pointer active:scale-95 transition">
                        <div class="aspect-[3/4] bg-stone-100 relative">
                            <img src="${img}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3">
                            <h3 class="font-medium text-sm truncate uppercase">${p.name}</h3>
                            <p class="font-bold text-xs text-amber-900 mt-1">${p.price} KGS</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            if (window.lucide) lucide.createIcons();
        }

        function openModal(index) {
            currentProduct = allProducts[index];
            selectedVariantIndex = 0;
            selectedSize = (currentProduct.sizes && currentProduct.sizes[0]) || "M";

            document.getElementById('modalTitle').innerText = currentProduct.name;
            document.getElementById('modalPrice').innerText = `${currentProduct.price} KGS`;
            document.getElementById('modalFabric').innerText = currentProduct.fabric ? `Состав: ${currentProduct.fabric}` : '';
            document.getElementById('modalDesc').innerText = currentProduct.description || '';

            renderVariants();
            renderSizes();

            document.getElementById('productModal').classList.remove('hidden');
        }

        function renderVariants() {
            const variants = currentProduct.variants || [];
            const container = document.getElementById('modalColors');
            
            if (variants.length > 0) {
                const activeVar = variants[selectedVariantIndex];
                document.getElementById('modalImg').src = activeVar.images[0] || '';
                document.getElementById('selectedColorName').innerText = activeVar.color || '';

                container.innerHTML = variants.map((v, i) => `
                    <button onclick="selectVariant(${i})" class="w-8 h-8 rounded-full border-2 ${i === selectedVariantIndex ? 'border-stone-900 scale-110' : 'border-transparent'} p-0.5 transition">
                        <span class="block w-full h-full rounded-full border border-stone-200" style="background-color: ${v.hex || '#1a1a1a'}"></span>
                    </button>
                `).join('');
            }
        }

        function selectVariant(index) {
            selectedVariantIndex = index;
            renderVariants();
        }

        function renderSizes() {
            const sizes = currentProduct.sizes || ["S", "M", "L"];
            const container = document.getElementById('modalSizes');

            container.innerHTML = sizes.map(s => `
                <button onclick="selectSize('${s}')" class="px-4 py-2 text-xs font-bold border rounded-lg ${selectedSize === s ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-700 border-stone-200'}">
                    ${s}
                </button>
            `).join('');
        }

        function selectSize(size) {
            selectedSize = size;
            renderSizes();
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function orderViaTelegram() {
            const variant = currentProduct.variants[selectedVariantIndex];
            const text = `Здравствуйте! Хочу заказать:\n` +
                         `• Изделие: ${currentProduct.name}\n` +
                         `• Размер: ${selectedSize}\n` +
                         `• Цвет: ${variant ? variant.color : 'Основной'}\n` +
                         `• Цена: ${currentProduct.price} KGS`;
            
            window.open(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`, '_blank');
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
