<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAI STUDIO — Админка</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-stone-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-xl font-bold uppercase mb-4 text-center tracking-wider">MIRAI STUDIO</h1>

        <!-- Авторизация -->
        <div id="authBox" class="space-y-4">
            <input type="number" id="adminPass" placeholder="Введите пароль (1234)" class="w-full p-3 border rounded-xl text-center text-lg outline-none focus:border-stone-800">
            <button type="button" onclick="login()" class="w-full py-3 bg-stone-900 text-white font-bold rounded-xl active:scale-95 transition">
                Войти в панель
            </button>
        </div>

        <!-- Форма -->
        <div id="adminForm" class="hidden space-y-4">
            <p class="text-green-600 font-bold text-center text-sm">✓ Панель готова к работе</p>

            <form id="productForm" class="space-y-3" onsubmit="return false;">
                <input type="text" id="pName" placeholder="Название изделия" required class="w-full p-3 border rounded-xl text-sm outline-none">
                
                <select id="pCategory" class="w-full p-3 border rounded-xl text-sm bg-white border">
                    <option value="платья">Платья</option>
                    <option value="костюмы">Костюмы</option>
                    <option value="блузы">Блузы</option>
                </select>

                <input type="number" id="pPrice" placeholder="Цена (KGS)" required class="w-full p-3 border rounded-xl text-sm outline-none">
                <input type="text" id="pFabric" placeholder="Состав / Ткань" class="w-full p-3 border rounded-xl text-sm outline-none">
                <textarea id="pDesc" placeholder="Описание изделия..." class="w-full p-3 border rounded-xl text-sm outline-none h-20"></textarea>

                <div class="border p-3 rounded-xl space-y-2 bg-stone-50">
                    <label class="block text-xs font-bold text-stone-600 uppercase">Цвет и фото:</label>
                    <div class="flex gap-2">
                        <input type="text" id="pColorName" placeholder="Цвет (напр: Чёрный)" class="w-1/2 p-2 border rounded-lg text-xs bg-white">
                        <input type="color" id="pColorHex" value="#1a1a1a" class="w-1/2 h-9 p-1 border rounded-lg bg-white cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-[10px] text-stone-500 mb-1">Фото из галереи (необязательно):</label>
                        <input type="file" id="varImageFile" accept="image/*" class="text-xs w-full">
                    </div>
                </div>

                <button type="button" onclick="handleSaveProduct()" id="saveBtn" class="w-full py-3 bg-amber-900 text-white font-bold rounded-xl active:scale-95 transition shadow-md">
                    Опубликовать товар
                </button>
            </form>

            <div id="statusBox" class="p-3 bg-gray-50 border rounded-xl hidden space-y-1">
                <p id="statusMsg" class="text-center text-xs font-bold text-stone-700"></p>
                <p id="errorDetail" class="text-[11px] text-red-600 break-words font-mono"></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vtkjphnmkghyztysttyd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-HXb9jeMmCmE8IJyOnZRSQ_hclHTZB2";

        function login() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === "1234") {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('adminForm').classList.remove('hidden');
            } else {
                alert("Неверный пароль!");
            }
        }

        async function handleSaveProduct() {
            const statusBox = document.getElementById('statusBox');
            const msg = document.getElementById('statusMsg');
            const errDetail = document.getElementById('errorDetail');
            const saveBtn = document.getElementById('saveBtn');
            
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            
            statusBox.classList.remove('hidden');
            errDetail.innerText = "";

            if (!name || isNaN(price)) {
                msg.innerText = "Заполните название и цену!";
                msg.className = "text-center text-xs font-bold text-red-600";
                return;
            }

            msg.innerText = "1/2. Загрузка данных...";
            msg.className = "text-center text-xs font-bold text-amber-600";
            saveBtn.disabled = true;

            try {
                const category = document.getElementById('pCategory').value;
                const fabric = document.getElementById('pFabric').value;
                const description = document.getElementById('pDesc').value;
                const colorName = document.getElementById('pColorName').value.trim() || "Основной";
                const colorHex = document.getElementById('pColorHex').value;
                const fileInput = document.getElementById('varImageFile');

                let imageUrl = "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80";

                // 1. Попытка загрузки картинки (если выбрана)
                if (fileInput.files.length > 0) {
                    msg.innerText = "1/2. Загрузка фотографии...";
                    const file = fileInput.files[0];
                    const cleanName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
                    
                    try {
                        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${cleanName}`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'x-upsert': 'true'
                            },
                            body: file
                        });

                        if (uploadRes.ok) {
                            imageUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${cleanName}`;
                        } else {
                            const errTxt = await uploadRes.text();
                            console.warn("Ошибка фото:", errTxt);
                        }
                    } catch (imgErr) {
                        console.warn("Пропуск загрузки фото из-за сети:", imgErr);
                    }
                }

                // 2. Отправка товара
                msg.innerText = "2/2. Сохранение в базу...";
                const payload = [{
                    name, 
                    category, 
                    price, 
                    description, 
                    fabric,
                    variants: [{ color: colorName, hex: colorHex, images: [imageUrl] }],
                    sizes: ["S", "M", "L"]
                }];

                const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });

                if (!dbRes.ok) {
                    const errJson = await dbRes.json();
                    throw new Error(`БД [${dbRes.status}]: ${errJson.message || JSON.stringify(errJson)}`);
                }

                msg.innerText = "✓ Товар успешно опубликован!";
                msg.className = "text-center text-xs font-bold text-green-600";
                document.getElementById('productForm').reset();

            } catch (err) {
                msg.innerText = "❌ Ошибка отправки";
                msg.className = "text-center text-xs font-bold text-red-600";
                errDetail.innerText = err.message || String(err);
            } finally {
                saveBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
