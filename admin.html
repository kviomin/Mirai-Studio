<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAI STUDIO — Админка</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-stone-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-xl font-bold uppercase mb-4 text-center tracking-wider">MIRAI STUDIO</h1>

        <!-- Форма входа -->
        <div id="authBox" class="space-y-4">
            <input type="number" id="adminPass" placeholder="Введите пароль (1234)" class="w-full p-3 border rounded-xl text-center text-lg outline-none focus:border-stone-800">
            <button type="button" onclick="login()" class="w-full py-3 bg-stone-900 text-white font-bold rounded-xl active:scale-95 transition">
                Войти в панель
            </button>
        </div>

        <!-- Форма добавления товара -->
        <div id="adminForm" class="hidden space-y-4">
            <p class="text-green-600 font-bold text-center text-sm">✓ Панель готова к работе</p>

            <form id="productForm" class="space-y-3" onsubmit="return false;">
                <input type="text" id="pName" placeholder="Название изделия" required class="w-full p-3 border rounded-xl text-sm outline-none">
                
                <select id="pCategory" class="w-full p-3 border rounded-xl text-sm bg-white border">
                    <option value="платья">Платья</option>
                    <option value="костюмы">Костюмы</option>
                    <option value="блузы">Блузы</option>
                </select>

                <input type="number" id="pPrice" placeholder="Цена (KGS)" required class="w-full p-3 border rounded-xl text-sm outline-none">
                <input type="text" id="pFabric" placeholder="Состав / Ткань" class="w-full p-3 border rounded-xl text-sm outline-none">
                <textarea id="pDesc" placeholder="Описание изделия..." class="w-full p-3 border rounded-xl text-sm outline-none h-20"></textarea>

                <div class="border p-3 rounded-xl space-y-2 bg-stone-50">
                    <label class="block text-xs font-bold text-stone-600 uppercase">Цвет:</label>
                    <div class="flex gap-2">
                        <input type="text" id="pColorName" placeholder="Цвет (напр: Чёрный)" class="w-1/2 p-2 border rounded-lg text-xs bg-white">
                        <input type="color" id="pColorHex" value="#1a1a1a" class="w-1/2 h-9 p-1 border rounded-lg bg-white cursor-pointer">
                    </div>
                </div>

                <button type="button" onclick="handleSaveProduct()" id="saveBtn" class="w-full py-3 bg-amber-900 text-white font-bold rounded-xl active:scale-95 transition shadow-md">
                    Опубликовать товар
                </button>
            </form>

            <p id="statusMsg" class="text-center text-xs font-bold min-h-[1.25rem] break-words"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vtkjphnmkghyztysttyd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-HXb9jeMmCmE8IJyOnZRSQ_hclHTZB2";

        function login() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === "1234") {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('adminForm').classList.remove('hidden');
            } else {
                alert("Неверный пароль!");
            }
        }

        async function handleSaveProduct() {
            const msg = document.getElementById('statusMsg');
            const saveBtn = document.getElementById('saveBtn');
            
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);

            if (!name || isNaN(price)) {
                msg.innerText = "Заполните название и цену!";
                msg.className = "text-center text-xs font-bold text-red-600";
                return;
            }

            msg.innerText = "Отправка в базу данных...";
            msg.className = "text-center text-xs font-bold text-amber-600";
            saveBtn.disabled = true;

            try {
                const category = document.getElementById('pCategory').value;
                const fabric = document.getElementById('pFabric').value;
                const description = document.getElementById('pDesc').value;
                const colorName = document.getElementById('pColorName').value.trim() || "Основной";
                const colorHex = document.getElementById('pColorHex').value;

                const payload = [{
                    name: name, 
                    category: category, 
                    price: price, 
                    description: description, 
                    fabric: fabric,
                    variants: [{ color: colorName, hex: colorHex, images: ["https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80"] }],
                    sizes: ["S", "M", "L"]
                }];

                const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    msg.innerText = "✓ Товар успешно опубликован!";
                    msg.className = "text-center text-xs font-bold text-green-600";
                    document.getElementById('productForm').reset();
                } else {
                    const errData = await response.json().catch(() => ({}));
                    msg.innerText = `Ошибка сервера (${response.status}): ${errData.message || response.statusText}`;
                    msg.className = "text-center text-xs font-bold text-red-600";
                }
            } catch (err) {
                msg.innerText = "Ошибка браузера/сети: " + err.message;
                msg.className = "text-center text-xs font-bold text-red-600";
            } finally {
                saveBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
