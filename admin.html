<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAI STUDIO — Админ-панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="p-4 bg-stone-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-xl font-bold uppercase mb-4 text-center">MIRAI STUDIO</h1>

        <!-- Форма входа -->
        <div id="authBox" class="space-y-4">
            <input type="password" id="adminPass" placeholder="Введите пароль (1234)" class="w-full p-3 border rounded-xl text-sm outline-none">
            <button type="button" onclick="login()" class="w-full py-3 bg-stone-900 text-white font-medium rounded-xl hover:bg-stone-800 transition">Войти</button>
        </div>

        <!-- Панель управления -->
        <div id="adminForm" class="hidden space-y-4 mt-4">
            <p class="text-green-600 font-bold text-center">Успешный вход!</p>
            <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-3">
                <input type="text" id="pName" placeholder="Название изделия" required class="w-full p-3 border rounded-xl text-sm">
                <select id="pCategory" class="w-full p-3 border rounded-xl text-sm bg-white">
                    <option value="платья">Платья</option>
                    <option value="костюмы">Костюмы</option>
                    <option value="блузы">Блузы</option>
                </select>
                <input type="number" id="pPrice" placeholder="Цена (KGS)" required class="w-full p-3 border rounded-xl text-sm">
                <input type="text" id="pFabric" placeholder="Состав / Ткань" class="w-full p-3 border rounded-xl text-sm">
                <textarea id="pDesc" placeholder="Описание" class="w-full p-3 border rounded-xl text-sm"></textarea>
                
                <div>
                    <label class="block text-xs text-stone-500 mb-1">Фото из галереи:</label>
                    <input type="file" id="varImageFile" accept="image/*" class="text-xs w-full">
                </div>

                <button type="submit" id="saveBtn" class="w-full py-3 bg-amber-800 text-white font-bold rounded-xl">Опубликовать</button>
            </form>
            <p id="statusMsg" class="text-center text-xs font-medium"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vtkjphnmkghyziysttyd.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "sb_publishable_-HXb9jeMmCmE8IJyOnZRSQ_hclHTZB2";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function login() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === "1234") {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('adminForm').classList.remove('hidden');
            } else {
                alert("Неверный пароль! Попробуйте 1234");
            }
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const msg = document.getElementById('statusMsg');
            msg.innerText = "Сохранение...";
            
            try {
                const name = document.getElementById('pName').value;
                const category = document.getElementById('pCategory').value;
                const price = parseInt(document.getElementById('pPrice').value);
                const fabric = document.getElementById('pFabric').value;
                const description = document.getElementById('pDesc').value;

                const fileInput = document.getElementById('varImageFile');
                let imageUrl = "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80";

                if (fileInput.files.length > 0 && supabase) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    const { error } = await supabase.storage.from('product-images').upload(fileName, file);
                    if (!error) {
                        const { data } = supabase.storage.from('product-images').getPublicUrl(fileName);
                        imageUrl = data.publicUrl;
                    }
                }

                const newProduct = {
                    name, category, price, description, fabric,
                    variants: [{ color: "Основной", hex: "#1a1a1a", images: [imageUrl] }],
                    sizes: ["S", "M", "L"]
                };

                if (supabase) {
                    await supabase.from('products').insert([newProduct]);
                }

                msg.innerText = "✓ Опубликовано!";
                msg.className = "text-center text-xs text-green-600 font-bold";
                document.getElementById('productForm').reset();
            } catch (err) {
                msg.innerText = "Ошибка сохранения";
            }
        }
    </script>
</body>
</html>
